<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Registration Form</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="form-wrapper">
    <h1>Registration Form</h1>
    <p class="subtitle">Fill in your details below</p>

    <form id="registrationForm" action="https://formspree.io/f/YOUR_CODE" method="POST" enctype="multipart/form-data">

      <div class="form-group">
        <label for="name">Full Name <span>*</span></label>
        <input type="text" id="name" name="name" placeholder="Enter your full name" required />
      </div>

      <div class="form-group">
        <label for="mobile">Mobile Number <span>*</span></label>
        <input type="tel" id="mobile" name="mobile" placeholder="Enter 10-digit mobile number" maxlength="10" required />
      </div>

      <div class="form-group">
        <label for="email">Email ID <span>*</span></label>
        <input type="email" id="email" name="email" placeholder="Enter your email address" required />
      </div>

      <div class="form-group">
        <label for="regno">Registration No. <span>*</span></label>
        <input type="text" id="regno" name="registration_number" placeholder="Enter your registration number" required />
      </div>

      <div class="form-group">
        <label for="fileUpload">Upload File <span>*</span></label>
        <input type="file" id="fileUpload" name="attachment" accept=".pdf,.jpg,.jpeg,.png,.doc,.docx" required />
        <small>Accepted: PDF, JPG, PNG, DOC, DOCX</small>
      </div>

      <button type="submit" class="submit-btn">Submit Form</button>

    </form>

    <div id="successMsg" class="success-msg" style="display:none;">
      ✅ Form submitted successfully! We will get back to you soon.
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
